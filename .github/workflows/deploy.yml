name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev
  KEYCLOAK_URL: https://keycloak-839680719947.europe-west1.run.app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./skillflow/backend
          target: production
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/skillflow/backend:${{ github.sha }}

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: ./skillflow/worker
          target: production
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/skillflow/worker:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./skillflow/frontend
          target: production
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/skillflow/frontend:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy skillflow-backend \
            --image=$REGISTRY/$PROJECT_ID/skillflow/backend:$GITHUB_SHA \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="NODE_ENV=production,KEYCLOAK_REALM=skillflow,KEYCLOAK_URL=$KEYCLOAK_URL,KEYCLOAK_CLIENT_ID=skillflow-backend,PUBSUB_PROJECT_ID=$PROJECT_ID,PUBSUB_TOPIC_NAME=skillflow-events,PUBSUB_SUBSCRIPTION_NAME=skillflow-worker-sub" \
            --set-secrets="DATABASE_URL=skillflow-db-url:latest,KEYCLOAK_CLIENT_SECRET=skillflow-keycloak-client-secret:latest"

      - name: Deploy worker to Cloud Run
        run: |
          gcloud run deploy skillflow-worker \
            --image=$REGISTRY/$PROJECT_ID/skillflow/worker:$GITHUB_SHA \
            --region=$REGION \
            --platform=managed \
            --no-allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="NODE_ENV=production,PUBSUB_PROJECT_ID=$PROJECT_ID,PUBSUB_TOPIC_NAME=skillflow-events,PUBSUB_SUBSCRIPTION_NAME=skillflow-worker-sub" \
            --set-secrets="DATABASE_URL=skillflow-db-url:latest,SMTP_HOST=skillflow-smtp-host:latest,SMTP_USER=skillflow-smtp-user:latest,SMTP_PASS=skillflow-smtp-pass:latest"

      - name: Get backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe skillflow-backend \
            --region=$REGION --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy skillflow-frontend \
            --image=$REGISTRY/$PROJECT_ID/skillflow/frontend:$GITHUB_SHA \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=4000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_API_URL=${{ steps.backend.outputs.url }}/v1,NEXT_PUBLIC_KEYCLOAK_URL=$KEYCLOAK_URL,NEXT_PUBLIC_KEYCLOAK_REALM=skillflow,NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=skillflow-frontend"

      - name: Print deployed URLs
        run: |
          echo "========================================="
          echo "Backend:  $(gcloud run services describe skillflow-backend --region=$REGION --format='value(status.url)')"
          echo "Worker:   $(gcloud run services describe skillflow-worker --region=$REGION --format='value(status.url)')"
          echo "Frontend: $(gcloud run services describe skillflow-frontend --region=$REGION --format='value(status.url)')"
          echo "Keycloak: $KEYCLOAK_URL"
          echo "========================================="
